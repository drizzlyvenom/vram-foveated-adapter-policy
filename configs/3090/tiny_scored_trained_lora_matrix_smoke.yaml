run:
  name: "3090_tiny_scored_trained_lora_matrix_smoke"
  output_dir: ".local/runs"
  seed: 42
  dry_run: false
  max_samples: 4
  allow_incomplete_matrix: true

hardware:
  target_gpu: "NVIDIA GeForce RTX 3090"
  vram_budget_mb: 24576
  normal_path_budget_mb: 22000

model:
  shared_backbone_id: "Qwen/Qwen3-VL-4B-Instruct"
  dtype: "float16"
  local_snapshot_path: ".local/hf_cache/hub/models--Qwen--Qwen3-VL-4B-Instruct/snapshots/ebb281ec70b05090aa6165b016eac8ec08e71b17"

data:
  mode: "tiny_scored_manifest"
  manifest_path: ".local/data/tiny_scored_manifest/manifest_ocr_detector.jsonl"
  roi_source: "ocr_detector_box"
  real_task_validation_required_for_promotion: false

model_residency_axis:
  M1_multi_specialist_baseline:
    enabled: true
    mode: "resident_estimate_and_sequential_swap"
    resident_estimate_method: "same_backbone_after_load_times_count"
    measured_sequential_swap_available: false
    measured_joint_residency_available: false
    specialist_models:
      - id: "doc_specialist_proxy"
      - id: "ocr_specialist_proxy"
      - id: "ui_specialist_proxy"
      - id: "chart_specialist_proxy"

adapter_bank:
  registry_path: "configs/3090/adapter_cards.yaml"
  execution_mode: "actual_peft"
  active_adapters_per_request: 1
  routing_granularity: "request_or_roi_level"
  allow_token_level_switching: false
  actual_peft:
    adapter_path: ".local/adapters/tiny_lora_latest"
    rank: 4
    alpha: 8
    target_modules: ["q_proj", "v_proj"]
    is_trainable: false
    uses_random_untrained_adapter: false

combined_matrix:
  cells:
    - id: "C3"
      model: "M3_shared_backbone_taxonomy_lora"
      visual: "V0_full_fixed_image"
    - id: "C4"
      model: "M3_shared_backbone_taxonomy_lora"
      visual: "V2_foveater_roi"

claim_boundary:
  allow_final_performance_claim: false
  allow_trained_lora_gain_claim: false
  allow_production_p99_claim: false
  allow_feasibility_claim: true
  trained_lora_matrix_smoke_only: true
  tiny_controlled_training_smoke: true
  trained_lora_accuracy_claim: false
